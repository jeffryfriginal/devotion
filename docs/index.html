<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Devotion</title>
<style>
  :root {
    --bg: #faf9f6;
    --text: #2b2620;
    --muted: #6b6459;
    --accent: #7a5c3e;
    --card: #ffffff;
    --border: #e6e1d8;
  }
  :root[data-theme="dark"] {
    --bg: #1a1613;
    --text: #ece6da;
    --muted: #a89d8c;
    --accent: #d8a662;
    --card: #221d18;
    --border: #3a3129;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header {
    margin-bottom: 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  header .header-text {
    flex: 1;
    min-width: 0;
  }
  header h1 {
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    font-weight: 500;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .theme-toggle {
    flex-shrink: 0;
    width: 52px;
    height: 28px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .theme-toggle .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: transform 0.25s ease, background-color 0.25s ease;
  }
  :root[data-theme="dark"] .theme-toggle .knob {
    transform: translateX(24px);
  }
  .controls {
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    color: var(--text);
  }
  .add-new-btn {
    margin-left: auto;
    font-family: inherit;
    font-size: 0.85rem;
    text-decoration: none;
    color: #fff;
    background: var(--accent);
    border-radius: 4px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .add-new-btn:hover {
    opacity: 0.9;
  }
  .calendar-toggle-btn {
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .calendar-toggle-btn:hover {
    background: var(--bg);
  }
  .calendar-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .calendar-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.9rem;
  }
  .calendar-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 10px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text);
  }
  .calendar-nav button:hover {
    background: var(--bg);
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    font-size: 0.8rem;
  }
  .calendar-grid .weekday {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  .calendar-grid .day-cell {
    padding: 6px 0 8px;
    border-radius: 4px;
    position: relative;
  }
  .calendar-grid .day-cell.has-entry {
    cursor: pointer;
  }
  .calendar-grid .day-cell.has-entry:hover {
    background: var(--bg);
  }
  .calendar-grid .dot {
    display: block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin: 3px auto 0;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 28px 24px;
    margin-bottom: 24px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .entry .date-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }
  .entry .date {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .entry-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .entry-actions a {
    font-size: 0.7rem;
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .entry-actions a:hover {
    background: var(--bg);
  }
  .entry-actions a.delete-link {
    color: #b3261e;
    border-color: #e8b9b5;
  }
  .entry-actions a.delete-link:hover {
    background: #fdf0ef;
  }
  .section {
    margin-bottom: 18px;
  }
  .section:last-child { margin-bottom: 0; }
  .section h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .section p {
    margin: 0;
    font-size: 1.05rem;
  }
  .application-list {
    margin: 0;
    padding-left: 1.2rem;
    font-size: 1.05rem;
  }
  .application-list li {
    margin-bottom: 6px;
  }
  .application-list li:last-child {
    margin-bottom: 0;
  }
  .section.scripture p {
    font-style: italic;
  }
  #status {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .search-box {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    margin-bottom: 16px;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .search-status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .back-to-top-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 10;
  }
  .back-to-top-btn:hover {
    opacity: 0.9;
  }
  .wrap {
    display: none;
  }
  .wrap.unlocked {
    display: block;
  }
  .password-gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: background-color 0.25s ease;
  }
  .password-gate-box {
    text-align: center;
    padding: 24px;
    max-width: 320px;
    width: 100%;
  }
  .password-gate-box h2 {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 16px;
    color: var(--text);
  }
  .password-gate-box input {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    text-align: center;
    box-sizing: border-box;
  }
  .password-gate-box button {
    margin-top: 12px;
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .password-gate-box button:hover {
    opacity: 0.9;
  }
  .password-gate-error {
    color: #b3261e;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 1.2em;
  }</style>
</head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" style="position:fixed; top:16px; right:16px; z-index:200;">
  <span class="knob">🌙</span>
</button>
<div id="passwordGate" class="password-gate">
  <div class="password-gate-box">
    <h2>Enter password</h2>
    <input type="password" id="passwordInput" autocomplete="off" />
    <button id="passwordSubmit" type="button">Unlock</button>
    <div id="passwordError" class="password-gate-error"></div>
  </div>
</div>
<div class="wrap" id="mainWrap">
  <header>
    <div class="header-text">
      <h1>Daily Devotion</h1>
      <p id="status">Loading…</p>
    </div>
  </header>
  <div class="controls">
    <label for="sortOrder">Sort:</label>
    <select id="sortOrder">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
    <a id="addNewLink" href="#" target="_blank" rel="noopener" class="add-new-btn">+ Add New Devotion</a>
    <button id="calendarToggle" class="calendar-toggle-btn" type="button">Show Calendar</button>
  </div>
  <div id="calendarPanel" class="calendar-panel" style="display:none;">
    <div class="calendar-nav">
      <button id="calPrev" type="button">&larr;</button>
      <span id="calLabel"></span>
      <button id="calNext" type="button">&rarr;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
  <input type="text" id="searchBox" class="search-box" placeholder="Search scripture, application, or prayer..." />
  <p id="searchStatus" class="search-status" style="display:none;"></p>
  <div id="entries"></div>
</div>
<button id="backToTop" class="back-to-top-btn" type="button" aria-label="Back to top" style="display:none;">&uarr; Top</button>

<script>
// Update this if the repo is ever renamed or transferred.
const REPO = 'jeffryfriginal/devotion';

// Paste your deployed Apps Script Web App URL here (Deploy > New deployment
// > Web app, after setting SITE_PASSWORD and WRITE_API_KEY in Script
// Properties). This URL itself is not secret, the password check happens
// server-side inside Apps Script regardless of who calls this URL or how.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz36LFzjUqpmZGlZqwnLqsFNpNWIRhYLH2XMl72CQAdGb8TzLLpdDqdFwLXJtsXqLXy1A/exec';

let devotions = [];

async function fetchDevotions(password) {
  const statusEl = document.getElementById('status');
  const url = `${APPS_SCRIPT_URL}?password=${encodeURIComponent(password)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Server error (${res.status})`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'Incorrect password.');

  if (!Array.isArray(data.data) || data.data.length === 0) {
    devotions = [];
    statusEl.textContent = 'No devotions yet.';
    return;
  }

  devotions = data.data;
  statusEl.remove();
  render();
  if (panel.style.display !== 'none') {
    renderCalendar();
  }
}

function editScriptureUrl(date, currentScripture) {
  const params = new URLSearchParams({
    template: 'edit-scripture.yml',
    date: date,
  });
  return `https://github.com/${REPO}/issues/new?${params.toString()}`;
}

function editDateUrl(date) {
  const params = new URLSearchParams({
    template: 'edit-date.yml',
    current_date: date,
  });
  return `https://github.com/${REPO}/issues/new?${params.toString()}`;
}

function deleteUrl(date) {
  const params = new URLSearchParams({
    template: 'delete.yml',
    date_to_delete: date,
  });
  return `https://github.com/${REPO}/issues/new?${params.toString()}`;
}

function newDevotionUrl() {
  return `https://github.com/${REPO}/issues/new?template=devotion.yml`;
}

document.getElementById('addNewLink').href = newDevotionUrl();

function matchesSearch(d, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const scriptureMatch = (d.scripture || '').toLowerCase().includes(q);
  const prayerMatch = (d.prayer || '').toLowerCase().includes(q);
  const applicationText = Array.isArray(d.application)
    ? d.application.join(' ')
    : (d.application || '');
  const applicationMatch = applicationText.toLowerCase().includes(q);
  return scriptureMatch || prayerMatch || applicationMatch;
}

function render() {
  const entriesEl = document.getElementById('entries');
  const searchStatusEl = document.getElementById('searchStatus');
  const order = document.getElementById('sortOrder').value;
  const query = document.getElementById('searchBox').value.trim();

  const filtered = devotions.filter((d) => matchesSearch(d, query));

  if (query) {
    searchStatusEl.style.display = 'block';
    searchStatusEl.textContent = filtered.length === 0
      ? `No entries match "${query}".`
      : `${filtered.length} of ${devotions.length} entries match "${query}".`;
  } else {
    searchStatusEl.style.display = 'none';
  }

  const sorted = [...filtered].sort((a, b) => {
    if (a.date === b.date) return 0;
    if (order === 'oldest') return a.date < b.date ? -1 : 1;
    return a.date < b.date ? 1 : -1; // newest first
  });

  entriesEl.innerHTML = '';
  for (const d of sorted) {
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.id = `entry-${normalizeDateStr(d.date) || d.date}`;
    entry.innerHTML = `
      <div class="date-row">
        <div class="date">${formatDate(d.date)}</div>
        <div class="entry-actions">
          <a href="${editScriptureUrl(d.date, d.scripture)}" target="_blank" rel="noopener">Edit Scripture</a>
          <a href="${editDateUrl(d.date)}" target="_blank" rel="noopener">Edit Date</a>
          <a href="${deleteUrl(d.date)}" target="_blank" rel="noopener" class="delete-link">Delete</a>
        </div>
      </div>
      <div class="section scripture">
        <h2>Scripture</h2>
        <p>${escapeHtml(d.scripture)}</p>
      </div>
      <div class="section">
        <h2>Application</h2>
        ${Array.isArray(d.application)
          ? `<ul class="application-list">${d.application.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ul>`
          : `<p>${escapeHtml(d.application)}</p>`}
      </div>
      <div class="section">
        <h2>Prayer</h2>
        <p>${escapeHtml(d.prayer)}</p>
      </div>
    `;
    entriesEl.appendChild(entry);
  }
}

document.getElementById('sortOrder').addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);

// --- Back to top --------------------------------------------------------

const backToTopBtn = document.getElementById('backToTop');
const SCROLL_SHOW_THRESHOLD = 400;

window.addEventListener('scroll', () => {
  backToTopBtn.style.display = window.scrollY > SCROLL_SHOW_THRESHOLD ? 'block' : 'none';
});

backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// --- Calendar ---------------------------------------------------------

let calYear, calMonth; // calMonth is 0-indexed

const toggleBtn = document.getElementById('calendarToggle');
const panel = document.getElementById('calendarPanel');

toggleBtn.addEventListener('click', () => {
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  toggleBtn.textContent = isHidden ? 'Hide Calendar' : 'Show Calendar';
  if (isHidden) {
    const today = new Date();
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderCalendar();
  }
});

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});

document.getElementById('calNext').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

function normalizeDateStr(raw) {
  if (!raw) return null;
  const match = String(raw).match(/^(\d{1,4})-(\d{1,2})-(\d{1,2})$/);
  if (!match) return null;
  const [, y, m, d] = match;
  return `${y.padStart(4, '0')}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
}

function renderCalendar() {
  const label = document.getElementById('calLabel');
  const grid = document.getElementById('calendarGrid');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  label.textContent = `${monthNames[calMonth]} ${calYear}`;

  const entryDates = new Set(
    devotions.map((d) => normalizeDateStr(d.date)).filter(Boolean)
  );

  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  grid.innerHTML = '';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach((wd) => {
    const el = document.createElement('div');
    el.className = 'weekday';
    el.textContent = wd;
    grid.appendChild(el);
  });

  for (let i = 0; i < startWeekday; i++) {
    grid.appendChild(document.createElement('div'));
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const hasEntry = entryDates.has(dateStr);

    const cell = document.createElement('div');
    cell.className = 'day-cell' + (hasEntry ? ' has-entry' : '');
    cell.innerHTML = `${day}${hasEntry ? '<span class="dot"></span>' : ''}`;

    if (hasEntry) {
      cell.addEventListener('click', () => {
        let target = document.getElementById(`entry-${dateStr}`);
        const searchBox = document.getElementById('searchBox');
        if (!target && searchBox.value.trim()) {
          searchBox.value = '';
          render();
          target = document.getElementById(`entry-${dateStr}`);
        }
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          target.style.outline = `2px solid var(--accent)`;
          setTimeout(() => { target.style.outline = 'none'; }, 1500);
        }
      });
    }

    grid.appendChild(cell);
  }
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// --- Dark mode ------------------------------------------------------------
// No persistence: resets to dark on every page load, by default. Toggle
// lives outside both the password gate and the unlocked wrap, so it's
// visible and functional on both screens without duplicating markup.

const themeToggle = document.getElementById('themeToggle');
const themeKnob = themeToggle.querySelector('.knob');

themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  if (isDark) {
    root.removeAttribute('data-theme');
    themeKnob.textContent = '☀️';
  } else {
    root.setAttribute('data-theme', 'dark');
    themeKnob.textContent = '🌙';
  }
});

// --- Password gate ----------------------------------------------------
// Real server-side check now: the typed password is sent to Apps Script,
// which validates it against SITE_PASSWORD stored in Script Properties
// (never in this file) and only returns data if it's correct. Unlike the
// old client-side-only version, there is no password to find in page
// source anymore, and there's no separate public data file to bypass to.

const gateEl = document.getElementById('passwordGate');
const wrapEl = document.getElementById('mainWrap');
const passwordInput = document.getElementById('passwordInput');
const passwordSubmit = document.getElementById('passwordSubmit');
const passwordError = document.getElementById('passwordError');

async function tryUnlock() {
  const typed = passwordInput.value;
  passwordSubmit.disabled = true;
  passwordSubmit.textContent = 'Checking password...';
  passwordError.textContent = '';

  try {
    await fetchDevotions(typed);
    gateEl.style.display = 'none';
    wrapEl.classList.add('unlocked');
  } catch (err) {
    passwordError.textContent = err.message === 'Incorrect password.'
      ? 'Incorrect password.'
      : 'Could not verify password. Try again.';
    passwordInput.value = '';
    passwordInput.focus();
    console.error(err);
  } finally {
    passwordSubmit.disabled = false;
    passwordSubmit.textContent = 'Unlock';
  }
}

passwordSubmit.addEventListener('click', tryUnlock);
passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryUnlock();
});
passwordInput.focus();
</script>
</body>
</html>
