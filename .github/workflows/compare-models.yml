name: Compare Models

on:
  workflow_dispatch:
    inputs:
      scripture:
        description: "Scripture to test (reference and/or full text)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run comparison
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPTURE_INPUT: ${{ inputs.scripture }}
        run: node scripts/compare-models.js
