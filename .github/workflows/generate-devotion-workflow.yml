name: Generate Devotion

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate devotion
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WRITE_API_KEY: ${{ secrets.WRITE_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/generate-devotion.js

      - name: Check if a devotion was actually generated
        id: check
        if: always()
        run: |
          if [ -f .generate-happened ]; then
            echo "happened=true" >> "$GITHUB_OUTPUT"
          else
            echo "happened=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment and close issue
        if: steps.check.outputs.happened == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Devotion generated and published. ✅"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Comment on failure
        if: steps.check.outputs.happened == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ Devotion generation failed. Check the Actions log for this run."
            });
